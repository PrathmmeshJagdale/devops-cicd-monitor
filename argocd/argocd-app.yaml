apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-cicd-monitor
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/PrathmmeshJagdale/devops-cicd-monitor.git
    targetRevision: main
    path: helm/cicd-monitor
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: cicd-monitor

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
