server.port=8081
spring.application.name=auth-service

# Database
spring.datasource.url=jdbc:mysql://mysql-auth:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.secret=devops-cicd-monitor-super-secret-key-2024-very-long-string
jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# CORS
spring.mvc.cors.allowed-origins=*
