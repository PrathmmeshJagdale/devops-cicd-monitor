server.port=8084
spring.application.name=retry-service

spring.datasource.url=jdbc:mysql://mysql-retry:3306/retry_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

jenkins.url=http://jenkins:8080
jenkins.username=admin
jenkins.token=admin
jenkins.mock-mode=true

retry.max-attempts=3

management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
