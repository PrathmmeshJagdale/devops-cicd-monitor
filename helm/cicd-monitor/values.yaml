# Global values shared across all services
global:
  registry: 219850556995.dkr.ecr.us-east-2.amazonaws.com
  projectName: devops-cicd
  imageTag: "latest"
  pullPolicy: IfNotPresent
  environment: production

# Auth Service
authService:
  name: auth-service
  enabled: true
  replicaCount: 1
  image:
    repository: 219850556995.dkr.ecr.us-east-2.amazonaws.com/devops-cicd/auth-service
    tag: "latest"
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  env:
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: root1234
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "300m"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70
  livenessProbe:
    path: /api/auth/health
    port: 8081
    initialDelaySeconds: 60
    periodSeconds: 30
  readinessProbe:
    path: /api/auth/health
    port: 8081
    initialDelaySeconds: 30
    periodSeconds: 10

