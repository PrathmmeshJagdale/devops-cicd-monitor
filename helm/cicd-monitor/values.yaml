# Frontend
frontend:
  name: frontend
  enabled: true
  replicaCount: 1
  image:
    repository: 219850556995.dkr.ecr.us-east-2.amazonaws.com/devops-cicd/frontend
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  livenessProbe:
    path: /
    port: 80
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    path: /
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 10

# MySQL - one per service
mysql:
  image: mysql:8.0
  rootPassword: root1234

# Ingress
ingress:
  enabled: true
  className: nginx
  host: ""
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

# Namespace
namespace: cicd-monitor
