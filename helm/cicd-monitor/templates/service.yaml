{{- range $key, $service := .Values }}
{{- if and (kindIs "map" $service) (hasKey $service "enabled") ($service.enabled) (hasKey $service "service") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $service.name }}
    environment: {{ $.Values.global.environment }}
    managed-by: helm
spec:
  type: {{ $service.service.type }}
  selector:
    app: {{ $service.name }}
  ports:
    - protocol: TCP
      port: {{ $service.service.port }}
      targetPort: {{ $service.service.targetPort }}
...
{{- end }}
{{- end }}
